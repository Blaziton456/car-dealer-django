<!DOCTYPE html>
<html>
<head>
    <title>Car Dealer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .login-area {
            margin-top: 15px;
        }

        .login-area input {
            padding: 8px;
            margin-right: 5px;
        }

        .login-area button,
        .review-button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-area button {
            background: white;
            color: #1f2937;
        }

        .user-info {
            margin-top: 15px;
            font-size: 16px;
        }

        .logout-button {
            margin-left: 15px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .container h2 {
            margin-bottom: 20px;
        }

        #dealers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .dealer-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .dealer-card h3 {
            margin-top: 0;
        }

        .dealer-card p {
            margin: 8px 0;
        }

        .review-button {
            display: inline-block;
            margin-top: 15px;
            background: #1f2937;
            color: white;
            text-decoration: none;
        }

        #login-message {
            margin-top: 8px;
            color: #ffdddd;
        }
    </style>
</head>

<body>

<header>
    <h1>Car Dealer</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/static/About.html">About Us</a>
        <a href="/static/Contact.html">Contact Us</a>
    </nav>

    {% if user.is_authenticated %}

        <div class="user-info">
            Logged in as: <strong>{{ user.username }}</strong>

            <button class="logout-button" onclick="logoutUser()">
                Logout
            </button>
        </div>

    {% else %}

        <div class="login-area">
            <form id="login-form">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

                <div id="login-message"></div>
            </form>
        </div>

    {% endif %}
</header>

<div class="container">

    <h2>Our Dealerships</h2>

    <div id="dealers">
        Loading dealers...
    </div>

</div>

<script>

    fetch("/fetchDealers")
        .then(response => response.json())
        .then(dealers => {

            const dealerContainer = document.getElementById("dealers");

            dealerContainer.innerHTML = "";

            dealers.forEach((dealer, index) => {

                const card = document.createElement("div");
                card.className = "dealer-card";

                card.innerHTML = `
                    <h3>${dealer.full_name}</h3>

                    <p>
                        <strong>Location:</strong>
                        ${dealer.state}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${dealer.address}
                    </p>

                    <p>
                        <strong>ZIP:</strong>
                        ${dealer.zip}
                    </p>

                    {% if user.is_authenticated %}
                        <a
                            class="review-button"
                            href="/dealer/${index + 1}/review"
                        >
                            Review Dealer
                        </a>
                    {% endif %}
                `;

                dealerContainer.appendChild(card);
            });
        })
        .catch(error => {
            document.getElementById("dealers").innerHTML =
                "<p>Unable to load dealers.</p>";

            console.error(error);
        });


    const loginForm = document.getElementById("login-form");

    if (loginForm) {

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            fetch("/djangoapp/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userName: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {

                if (data.userName) {

                    window.location.reload();

                } else {

                    document.getElementById("login-message").textContent =
                        "Invalid username or password.";
                }
            })
            .catch(error => {

                document.getElementById("login-message").textContent =
                    "Login failed.";

                console.error(error);
            });
        });
    }


    function logoutUser() {

        fetch("/djangoapp/logout")
            .then(() => {
                window.location.reload();
            });
    }

</script>

</body>
</html>
