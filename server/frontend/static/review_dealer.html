<!DOCTYPE html>
<html>
<head>
    <title>Post Review</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .user-info {
            margin-top: 15px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 35px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
        }

        .submit-button {
            background: #1f2937;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>

    <h1>Car Dealer</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/static/About.html">About Us</a>
        <a href="/static/Contact.html">Contact Us</a>
    </nav>

    {% if user.is_authenticated %}
        <div class="user-info">
            Logged in as: <strong>{{ user.username }}</strong>
        </div>
    {% endif %}

</header>

<div class="container">

    <div class="form-card">

        <h2>Post Review</h2>

        <p>
            <strong>Dealership:</strong>
            {{ dealer.full_name }}
        </p>

        <form method="POST">
    {% csrf_token %}

            <div class="form-group">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="Mitesh"
                    required
                >
            </div>

            <div class="form-group">
                <label for="review">Review</label>
                <textarea
                    id="review"
                    name="review"
                    required
                >Excellent service and very helpful staff!</textarea>
            </div>

            <div class="form-group checkbox-group">
                <input
                    type="checkbox"
                    id="purchase"
                    name="purchase"
                    checked
                >

                <label for="purchase">
                    I purchased a vehicle from this dealer
                </label>
            </div>

            <div class="form-group">
                <label for="purchase_date">Purchase Date</label>

                <input
                    type="text"
                    id="purchase_date"
                    name="purchase_date"
                    value="10/01/2026"
                    required
                >
            </div>

            <div class="form-group">
                <label for="car_make">Car Make</label>

                <select id="car_make" name="car_make">

                    <option value="Toyota" selected>
                        Toyota
                    </option>

                    <option value="Honda">
                        Honda
                    </option>

                    <option value="Ford">
                        Ford
                    </option>

                    <option value="BMW">
                        BMW
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="car_model">Car Model</label>

                <input
                    type="text"
                    id="car_model"
                    name="car_model"
                    value="Camry"
                    required
                >
            </div>

            <div class="form-group">
                <label for="car_year">Car Year</label>

                <input
                    type="number"
                    id="car_year"
                    name="car_year"
                    value="2025"
                    required
                >
            </div>

            <button
                type="submit"
                class="submit-button"
            >
                Post Review
            </button>

        </form>

    </div>

</div>

</body>
</html>
